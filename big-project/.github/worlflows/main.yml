name: Deploy Website

on:
  push:
    branches: [ main ]

 jobs:
 deploy:
   runs-on: ubuntu-latest

   steps:
   - name: Deploy to GitHub Pages
     uses: actions/checkout@v2
     uses: actions/upload-pages-artifact@v3
     with:
      path: .
    - name: Deploy 
      uses: actions/deploy-pages@v4

     